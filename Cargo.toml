[package]
name = "onaygit"
version = "0.1.0"
edition = "2021"
description = "A simple GitHub Desktop style Git client in Rust"
authors = ["Tisobyn"]
repository = "https://github.com/Tisobyn/OnayGit"
build = "build.rs"

[[bin]]
name = "OnayGit"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
rfd = "0.15"
egui_extras = { version = "0.29", features = ["svg", "file", "image"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
