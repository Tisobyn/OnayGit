[package]
name = "onaygit"
version = "0.1.0"
edition = "2021"
description = "A simple GitHub Desktop style Git client in Rust"

[dependencies]
eframe = "0.29"
rfd = "0.15"
egui_extras = { version = "0.29", features = ["svg", "file", "image"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
